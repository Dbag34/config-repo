resources:
  - ../../base/voice-bot

patches:
  - target:
      kind: Rollout
      name: voice-bot
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 10
      - op: replace
        path: /spec/template/spec/containers/0/image
        value: dbag34/voice-bot-rollout:blue
  - target:
      kind: Ingress
      name: voice-bot-ingress
    patch: |-
      - op: replace
        path: /spec/rules/0/host
        value: voice-bot-prod.example.com