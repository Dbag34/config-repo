apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: voice-bot
  namespace: argocd

spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]

  generators:
    - list:
        elements:
          - env: dev
          - env: uat
          - env: cug
          - env: prod

  template:
    metadata:
      name: voice-bot-{{.env}}

    spec:
      project: default

      source:
        repoURL: https://github.com/Dbag34/config-repo.git
        targetRevision: main
        path: overlays/{{.env}}

      destination:
        server: https://kubernetes.default.svc
        namespace: voice-bot-{{.env}}

      syncPolicy:
        automated:
          prune: true
          selfHeal: true

        syncOptions:
          - CreateNamespace=true