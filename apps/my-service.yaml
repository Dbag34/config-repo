apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: voice-bot
  namespace: argocd

spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]

  generators:
    - matrix:
        generators:
          - list:
              elements:
                - env: dev
                - env: prod
          - list:
              elements:
                - cluster: west-us2
                  serverURL: https://kubernetes.default.svc

  template:
    metadata:
      name: voice-bot-{{.env}}-{{.cluster}}

    spec:
      project: default

      source:
        repoURL: https://github.com/Dbag34/config-repo.git
        targetRevision: main
        path: overlays/{{.env}}

      destination:
        server: "{{.serverURL}}"
        namespace: voice-bot-{{.env}}

      syncPolicy:
        automated:
          prune: true
          selfHeal: true

        syncOptions:
          - CreateNamespace=true