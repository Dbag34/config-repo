apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: my-service
  namespace: argocd

spec:
  project: default

  source:
    repoURL: https://github.com/Dbag34/config-repo.git
    targetRevision: main
    path: manifests/my-service

  destination:
    server: https://kubernetes.default.svc
    namespace: my-service

  syncPolicy:
    automated:
      prune: true
      selfHeal: true

    syncOptions:
      - CreateNamespace=true